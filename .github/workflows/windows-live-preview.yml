name: Windows LIVE Preview VST3 (noncommercial)
on:
  workflow_dispatch:
  pull_request:
    branches: [feat/phase5f-hybrid-3d-controls-20261106]
  push:
    branches: [feat/masterlabx-live-brain-20261107]
    paths:
      - 'Source/**'
      - 'tests/LivePluginIntegration.cpp'
      - 'tests/LiveStem**'
      - 'tests/StateTests.cpp'
      - 'CMakeLists.txt'
      - 'install/*live*'
      - 'install/*LIVE*'
      - '.github/workflows/windows-live-preview.yml'
permissions:
  contents: read
concurrency:
  group: masterlabx-live-preview
  cancel-in-progress: true
jobs:
  live-preview:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic tooling
        run: python -m pip install --disable-pip-version-check pillow==12.0.0 psutil==7.1.3 numpy==2.5.4
      - name: Fetch pinned evaluation models
        run: python tools/fetch_stemgenrt_models.py --out build/models --accept-noncommercial-model-terms
      - name: Fetch official ONNX Runtime 1.26.0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest https://github.com/microsoft/onnxruntime/releases/download/v1.26.0/onnxruntime-win-x64-1.26.0.zip -OutFile build/ort.zip
          Expand-Archive build/ort.zip -DestinationPath build
      - name: Configure Windows LIVE VST3
        shell: pwsh
        run: |
          $py = python -c "import sys; print(sys.executable)"
          cmake -S . -B build-live -A x64 -DMASTERLAB_PLUGIN=ON -DMASTERLAB_STEMGENRT=ON -DMASTERLAB_LIVE_STEM_PLUGIN=ON "-DMASTERLAB_ORT_ROOT=$pwd/build/onnxruntime-win-x64-1.26.0" "-DMASTERLAB_STEMGENRT_MODELS=$pwd/build/models" "-DPython3_EXECUTABLE=$py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build LIVE plugin and tests
        run: cmake --build build-live --config Release --parallel 2
      - name: Existing compatibility and native neural tests
        run: ctest --test-dir build-live -C Release --output-on-failure
      - name: Actual streaming integration through JUCE processBlock
        shell: pwsh
        run: |
          $env:MASTERLAB_STEMGENRT_MODELS = (Resolve-Path build/models).Path
          & ./build-live/Release/live_plugin_integration.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate real LIVE VST3 via pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip -OutFile build/pluginval.zip
          Expand-Archive build/pluginval.zip -DestinationPath build/validator
          $exe=(Get-ChildItem build/validator -Filter pluginval.exe -Recurse | Select-Object -First 1).FullName
          if (-not $exe) { throw 'pluginval executable missing' }
          & $exe --strictness-level 5 --validate "$pwd/build-live/JerzyMasterLabX_artefacts/Release/VST3/JerzyMasterLabX.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows loader diagnostic with real VST3 bundle
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "install/diagnose_masterlabx_live.ps1" -PluginPath "$pwd/build-live/JerzyMasterLabX_artefacts/Release/VST3/JerzyMasterLabX.vst3" -NoPause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage LIVE preview package without model weights
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage='build-live/LIVE-PREVIEW-Windows-x64'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'build-live/JerzyMasterLabX_artefacts/Release/VST3/JerzyMasterLabX.vst3' "$stage/JerzyMasterLabX.vst3" -Recurse -Force
          if(!(Test-Path "$stage/JerzyMasterLabX.vst3/Contents/x86_64-win/JerzyMasterLabX.vst3")){throw 'Missing VST3 binary'}
          if(!(Test-Path "$stage/JerzyMasterLabX.vst3/Contents/x86_64-win/JerzyMasterLabX_ort_1_26.dll")){throw 'Missing ONNX Runtime dependency'}
          # A VST3 linking to the generic DLL would pick up the System32
          # copy and crash on ORT GetApi(26). The packaged DLL is unique.
          $native = "$stage/JerzyMasterLabX.vst3/Contents/x86_64-win/JerzyMasterLabX.vst3"
          $nativeBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $native).Path)
          $nativeAscii = [System.Text.Encoding]::ASCII.GetString($nativeBytes)
          if ($nativeAscii.Contains('onnxruntime.dll')) { throw 'VST3 still references generic onnxruntime.dll' }
          Copy-Item 'install/INSTALL_MASTERLABX_LIVE.cmd' "$stage/INSTALL_MASTERLABX_LIVE.cmd"
          Copy-Item 'install/install_masterlabx_live.ps1' "$stage/install_masterlabx_live.ps1"
          Copy-Item 'install/NAPRAW_MASTERLABX.ps1' "$stage/NAPRAW_MASTERLABX.ps1"
          Copy-Item 'install/NAPRAW_MASTERLABX.cmd' "$stage/NAPRAW_MASTERLABX.cmd"
          (Get-FileHash "$stage/JerzyMasterLabX.vst3/Contents/x86_64-win/JerzyMasterLabX.vst3" -Algorithm SHA256).Hash | Out-File "$stage/VST3-SHA256.txt" -Encoding ascii
          $expectedHash = (Get-Content "$stage/VST3-SHA256.txt" -TotalCount 1).Trim()
          $actualHash = (Get-FileHash "$stage/JerzyMasterLabX.vst3/Contents/x86_64-win/JerzyMasterLabX.vst3" -Algorithm SHA256).Hash
          if ($expectedHash -ne $actualHash) { throw 'VST3 repair manifest mismatch' }
          Copy-Item 'install/DIAGNOSE_MASTERLABX_LIVE.cmd' "$stage/DIAGNOSE_MASTERLABX_LIVE.cmd"
          Copy-Item 'install/diagnose_masterlabx_live.ps1' "$stage/diagnose_masterlabx_live.ps1"
          Copy-Item 'docs/LIVE_PREVIEW_WINDOWS.md' "$stage/README-LIVE.md"
          New-Item -ItemType Directory -Force "$stage/licenses" | Out-Null
          Copy-Item 'licenses/StemgenRT' "$stage/licenses/StemgenRT" -Recurse -Force
          $models=Get-ChildItem $stage -Recurse -Filter *.onnx -File
          if($models){throw 'Model weights must NOT be bundled in the CI artifact'}
          Compress-Archive "$stage/*" 'build-live/MasterLabX-LIVE-PREVIEW-Windows-x64.zip' -Force
          Get-FileHash 'build-live/MasterLabX-LIVE-PREVIEW-Windows-x64.zip' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MasterLabX-LIVE-PREVIEW-Windows-x64
          path: build-live/MasterLabX-LIVE-PREVIEW-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MasterLabX-LIVE-PREVIEW-test-logs
          path: |
            build-live/Testing/Temporary/
          if-no-files-found: warn
) { throw 'VST3 still statically imports onnxruntime.dll' }
          Copy-Item 'install/INSTALL_MASTERLABX_LIVE.cmd' "$stage/INSTALL_MASTERLABX_LIVE.cmd"
          Copy-Item 'install/install_masterlabx_live.ps1' "$stage/install_masterlabx_live.ps1"
          Copy-Item 'install/NAPRAW_MASTERLABX.ps1' "$stage/NAPRAW_MASTERLABX.ps1"
          Copy-Item 'install/NAPRAW_MASTERLABX.cmd' "$stage/NAPRAW_MASTERLABX.cmd"
          (Get-FileHash "$stage/JerzyMasterLabX.vst3/Contents/x86_64-win/JerzyMasterLabX.vst3" -Algorithm SHA256).Hash | Out-File "$stage/VST3-SHA256.txt" -Encoding ascii
          $expectedHash = (Get-Content "$stage/VST3-SHA256.txt" -TotalCount 1).Trim()
          $actualHash = (Get-FileHash "$stage/JerzyMasterLabX.vst3/Contents/x86_64-win/JerzyMasterLabX.vst3" -Algorithm SHA256).Hash
          if ($expectedHash -ne $actualHash) { throw 'VST3 repair manifest mismatch' }
          Copy-Item 'install/DIAGNOSE_MASTERLABX_LIVE.cmd' "$stage/DIAGNOSE_MASTERLABX_LIVE.cmd"
          Copy-Item 'install/diagnose_masterlabx_live.ps1' "$stage/diagnose_masterlabx_live.ps1"
          Copy-Item 'docs/LIVE_PREVIEW_WINDOWS.md' "$stage/README-LIVE.md"
          New-Item -ItemType Directory -Force "$stage/licenses" | Out-Null
          Copy-Item 'licenses/StemgenRT' "$stage/licenses/StemgenRT" -Recurse -Force
          $models=Get-ChildItem $stage -Recurse -Filter *.onnx -File
          if($models){throw 'Model weights must NOT be bundled in the CI artifact'}
          Compress-Archive "$stage/*" 'build-live/MasterLabX-LIVE-PREVIEW-Windows-x64.zip' -Force
          Get-FileHash 'build-live/MasterLabX-LIVE-PREVIEW-Windows-x64.zip' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MasterLabX-LIVE-PREVIEW-Windows-x64
          path: build-live/MasterLabX-LIVE-PREVIEW-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MasterLabX-LIVE-PREVIEW-test-logs
          path: |
            build-live/Testing/Temporary/
          if-no-files-found: warn
