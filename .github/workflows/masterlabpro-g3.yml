name: MasterLabPro G3
on:
  push:
    branches: [masterlabpro-development]
    paths:
      - 'MasterLabPro/**'
      - '.github/workflows/masterlabpro-g3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure independent project
        shell: pwsh
        run: |
          if (-not (Test-Path 'MasterLabPro/assets/manifest.json')) {
            throw 'Approved Package A assets are mandatory for the strict Windows build.'
          }
          $options = @('-DMASTERLABPRO_GUI_CHECK=ON','-DMASTERLABPRO_CONSOLE=ON')
          $root = (Resolve-Path 'MasterLabPro/assets').Path
          $options += "-DMASTERLABPRO_ASSET_ROOT=$root"
          cmake -S MasterLabPro -B build-masterlabpro -A x64 @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          cmake --build build-masterlabpro --config Release --parallel 2 2>&1 | Tee-Object -FilePath reports/build-windows.log
          if ($LASTEXITCODE -ne 0) {
            $message = (Get-Content reports/build-windows.log -Tail 80) -join "`n"
            $message = $message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows compiler output::$message"
            exit $LASTEXITCODE
          }
      - name: Upload failed Windows build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MasterLabPro-Windows-Build-Failure
          path: reports/build-windows.log
          if-no-files-found: error
      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build-masterlabpro -C Release --output-on-failure --output-junit reports-tests.xml 2>&1 | Tee-Object -FilePath reports/ctest-windows.log
          if ($LASTEXITCODE -ne 0) {
            $message = (Get-Content reports/ctest-windows.log -Tail 100) -join "`n"
            $message = $message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows CTest output::$message"
            exit $LASTEXITCODE
          }
      - name: Measure CPU RAM and PDC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          & build-masterlabpro/Release/masterlabpro_benchmark.exe | Tee-Object -FilePath reports/performance-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build-masterlabpro/Release/masterlabpro_module_benchmark.exe | Tee-Object -FilePath reports/performance-modules-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build-masterlabpro/Release/masterlabpro_modular_graph_test.exe | Tee-Object -FilePath reports/pdc-windows.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage approved assets beside executable
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force 'MasterLabPro/assets' 'build-masterlabpro/MasterLabProConsole_artefacts/Release/assets'
          $package = 'build-masterlabpro/MasterLabProConsole_artefacts/Release'
          New-Item -ItemType Directory -Force "$package/modules" | Out-Null
          Copy-Item build-masterlabpro/Release/mlp_unity.dll,build-masterlabpro/Release/mlp_gain.dll,build-masterlabpro/Release/mlp_saturation.dll,build-masterlabpro/Release/mlp_delay.dll "$package/modules"
          New-Item -ItemType Directory -Force "$package/sdk" | Out-Null
          Copy-Item MasterLabPro/sdk/masterlabpro_module_abi.h "$package/sdk"
          New-Item -ItemType Directory -Force "$package/docs" | Out-Null
          Copy-Item MasterLabPro/ARCHITECTURE.md,MasterLabPro/MODULE_SDK.md,MasterLabPro/MODULE_ABI.md,MasterLabPro/REALTIME_CONTRACT.md,MasterLabPro/PARAMETER_MAPPING.md,MasterLabPro/LATENCY_AND_DELTA.md,MasterLabPro/STATE_FORMAT.md,MasterLabPro/PACKAGE_B_REPORT.md "$package/docs"
      - name: Upload standalone GUI
        uses: actions/upload-artifact@v4
        with:
          name: MasterLabPro-GUI-Windows
          path: |
            build-masterlabpro/MasterLabProConsole_artefacts/Release/*.exe
            build-masterlabpro/MasterLabProConsole_artefacts/Release/assets/
          if-no-files-found: error
      - name: Upload rack smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: MasterLabPro-Rack-Smoke
          path: build-masterlabpro/rack-smoke.png
          if-no-files-found: error
      - name: Upload strict A+C screenshot
        uses: actions/upload-artifact@v4
        with:
          name: MasterLabPro-Rack-AC
          path: build-masterlabpro/rack-ac*.png
          if-no-files-found: error
      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: MasterLabPro-Performance-Windows
          path: reports/performance-windows.json
          if-no-files-found: error
      - name: Upload Package B reports
        uses: actions/upload-artifact@v4
        with:
          name: MasterLabPro-Package-B-Reports
          path: |
            reports/*.json
            reports-tests.xml
            MasterLabPro/MODULE_ABI.md
            MasterLabPro/PACKAGE_B_REPORT.md
          if-no-files-found: error
      - name: Upload technical modules
        uses: actions/upload-artifact@v4
        with:
          name: MasterLabPro-Technical-Modules-Windows
          path: build-masterlabpro/MasterLabProConsole_artefacts/Release/modules/*.dll
          if-no-files-found: error
      - name: Upload Module SDK and architecture
        uses: actions/upload-artifact@v4
        with:
          name: MasterLabPro-Module-SDK
          path: |
            MasterLabPro/sdk/
            MasterLabPro/ARCHITECTURE.md
            MasterLabPro/MODULE_SDK.md
            MasterLabPro/MODULE_ABI.md
            MasterLabPro/REALTIME_CONTRACT.md
            MasterLabPro/PARAMETER_MAPPING.md
            MasterLabPro/LATENCY_AND_DELTA.md
            MasterLabPro/STATE_FORMAT.md
          if-no-files-found: error

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            option: MASTERLABPRO_ASAN_UBSAN
          - name: tsan
            option: MASTERLABPRO_TSAN
    steps:
      - uses: actions/checkout@v4
      - name: Configure ${{ matrix.name }}
        run: cmake -S MasterLabPro -B build-${{ matrix.name }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -D${{ matrix.option }}=ON
      - name: Build ${{ matrix.name }}
        run: cmake --build build-${{ matrix.name }} --parallel 2
      - name: Test ${{ matrix.name }}
        run: ctest --test-dir build-${{ matrix.name }} --output-on-failure
