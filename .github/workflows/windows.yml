name: Windows VST3
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: masterlabx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI renderer dependencies
        run: python -m pip install --disable-pip-version-check pillow==12.0.0
      - name: Configure MSVC x64
        shell: pwsh
        run: |
          $py = python -c "import sys; print(sys.executable)"
          cmake -S . -B build -A x64 "-DPython3_EXECUTABLE=$py"
      - name: Build Release
        run: cmake --build build --config Release --parallel 2
      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Measure adversarial true-peak and CPU on Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/truepeak-evidence | Out-Null
          & ./build/Release/final_true_peak_adversarial_tests.exe | Tee-Object -FilePath build/truepeak-evidence/adversarial-8x.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/Release/final_true_peak_benchmark.exe | Tee-Object -FilePath build/truepeak-evidence/cpu-benchmark.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: TruePeak-8x-adversarial-and-CPU-evidence
          path: build/truepeak-evidence/
          if-no-files-found: error
      - name: Report test failure details
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build/Testing/Temporary -Filter '*TestsFailed*' | ForEach-Object { Get-Content $_.FullName | ForEach-Object { Write-Output "::error::Failed CTest: $_" } }
          if (Test-Path build/Testing/Temporary/LastTest.log) {
            $report = (Get-Content build/Testing/Temporary/LastTest.log -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::notice::CTest details: $report"
          }
      - name: Render Stereo Architect evidence from actual DSP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/stereo-evidence | Out-Null
          & ./build/Release/stereo_tests.exe build/stereo-evidence | Out-File -Encoding utf8 build/stereo-evidence/metrics.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Stereo-Architect-matched-WAV-and-metrics
          path: build/stereo-evidence/
          if-no-files-found: error
      - name: Render Parallel routing evidence from actual DSP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/parallel-evidence | Out-Null
          & ./build/Release/parallel_evidence.exe build/parallel-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Parallel-routing-matched-WAV-and-metrics
          path: build/parallel-evidence/
          if-no-files-found: error
      - name: Render Smart Dynamics evidence from actual DSP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/dynamics-evidence | Out-Null
          & ./build/Release/dynamics_evidence.exe build/dynamics-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Dynamics-matched-WAV-and-metrics
          path: build/dynamics-evidence/
          if-no-files-found: error
      - name: Render Stabilizer evidence from actual DSP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/stabilizer-evidence | Out-Null
          & ./build/Release/stabilizer_evidence.exe build/stabilizer-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Stabilizer-matched-WAV-and-metrics
          path: build/stabilizer-evidence/
          if-no-files-found: error
      - name: GUI reopen and resize smoke test
        run: ./build/Release/plugin_tests.exe --gui
      - name: Upload Concept C real GUI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Concept-C-JUCE-GUI-screenshots
          path: |
            build-plugin/*-smoke.png
            build-plugin/console-*.png
          if-no-files-found: error
      - name: Download pluginval 1.0.3
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath validator
      - name: Validate actual VST3
        shell: pwsh
        run: |
          $validator = (Get-ChildItem validator -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          if (-not $validator) { throw 'pluginval missing' }
          & $validator --strictness-level 5 --validate "$pwd/build/JerzyMasterLabX_artefacts/Release/VST3/JerzyMasterLabX.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage native offline HTDemucs four-stem separator and model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/StemEngine/models | Out-Null
          $tag = 'v0.1.6'
          $runtimeUrl = "https://github.com/betweentwomidnights/stems.cpp/releases/download/$tag/stems-$tag-windows-x64-core.zip"
          curl.exe --fail --location --retry 4 -o build/stems-native-core.zip $runtimeUrl
          if ($LASTEXITCODE -ne 0) { throw 'Native stems.cpp binary download failed' }
          Expand-Archive -Path build/stems-native-core.zip -DestinationPath build/StemEngine -Force
          $modelUrl = 'https://huggingface.co/thepatch/htdemucs-GGUF/resolve/main/htdemucs-42M-v1.0-F16.gguf?download=true'
          curl.exe --fail --location --retry 4 -o build/StemEngine/models/htdemucs-42M-v1.0-F16.gguf $modelUrl
          if ($LASTEXITCODE -ne 0) { throw 'Real HTDemucs weights download failed; will not package fake source separation' }
          if ((Get-Item build/StemEngine/models/htdemucs-42M-v1.0-F16.gguf).Length -lt 40000000) {
            throw 'HTDemucs weights are incomplete'
          }
          $header = [System.IO.File]::ReadAllBytes((Resolve-Path 'build/StemEngine/models/htdemucs-42M-v1.0-F16.gguf'))
          if ([Text.Encoding]::ASCII.GetString($header,0,4) -ne 'GGUF') { throw 'Invalid HTDemucs GGUF model' }
          if (-not (Test-Path build/StemEngine/stems-split.exe)) { throw 'Native separator executable missing' }
          & ./build/StemEngine/stems-split.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Native separator cannot run on Windows runner' }
      - name: Prove real HTDemucs inference and 4 WAV stems on Windows CPU
        shell: pwsh
        run: |
          @'
          import math, struct, wave
          path = 'build/stem-inference-smoke.wav'
          with wave.open(path, 'wb') as wav:
              wav.setnchannels(2)
              wav.setsampwidth(2)
              wav.setframerate(44100)
              pcm = bytearray()
              for i in range(44100 * 9):
                  sample = int(9000 * math.sin(2 * math.pi * 110 * i / 44100) + 4000 * math.sin(2 * math.pi * 440 * i / 44100))
                  pcm += struct.pack('<hh', sample, sample)
              wav.writeframes(pcm)
          '@ | python -
          New-Item -ItemType Directory -Force build/stem-inference-smoke-out | Out-Null
          & ./build/StemEngine/stems-split.exe -m build/StemEngine/models/htdemucs-42M-v1.0-F16.gguf -i build/stem-inference-smoke.wav -o build/stem-inference-smoke-out --float32
          if ($LASTEXITCODE -ne 0) { throw 'The actual native HTDemucs inference test failed' }
          $output = @(Get-ChildItem build/stem-inference-smoke-out -Recurse -Filter '*.wav' -File)
          foreach ($stem in @('drums','bass','other','vocals')) {
            if (-not ($output | Where-Object { $_.Name -match $stem })) { throw "No $stem stem was separated" }
          }
          Write-Output "Verified: four distinct neural-separated WAV files, not frequency approximations."
      - name: Package verified binary
        shell: pwsh
        run: |
          $bundle = 'build/JerzyMasterLabX_artefacts/Release/VST3/JerzyMasterLabX.vst3'
          if (-not (Test-Path "$bundle/Contents/x86_64-win/JerzyMasterLabX.vst3")) { throw 'VST3 binary missing' }
          if (-not (Test-Path 'build/Release/brain_demo.exe')) { throw 'Brain analysis executable missing' }
          Copy-Item README.md build/INSTALACJA.md
          Copy-Item Assets/Fonts/OFL-Manrope.txt build/OFL-Manrope.txt
          Copy-Item install/INSTALL_MASTERLABX.cmd build/INSTALL_MASTERLABX.cmd
          Copy-Item install/install_masterlabx.ps1 build/install_masterlabx.ps1
          Copy-Item docs/MASTER_BRAIN_STEMS.md build/MASTER_BRAIN_STEMS.md
          Compress-Archive -Path $bundle,build/StemEngine,build/INSTALL_MASTERLABX.cmd,build/install_masterlabx.ps1,build/INSTALACJA.md,build/MASTER_BRAIN_STEMS.md,build/OFL-Manrope.txt -DestinationPath JerzyMasterLabX-v0.1.0-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JerzyMasterLabX-v0.1.0-Windows-x64
          path: JerzyMasterLabX-v0.1.0-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MasterLabX-analysis-tools-Windows-x64
          path: |
            build/Release/brain_demo.exe
            Assets/Fonts/OFL-Manrope.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-plugin/gui-smoke.png
            build-plugin/limiter-smoke.png
            build-plugin/inspector-smoke.png
            build-plugin/brain-smoke.png
            build-plugin/dynamic-eq-smoke.png
            build-plugin/dynamics-smoke.png
            build-plugin/stereo-smoke.png
            build-plugin/parallel-smoke.png
            build-plugin/stabilizer-smoke.png
