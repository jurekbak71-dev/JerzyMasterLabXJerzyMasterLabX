name: Noncommercial StemgenRT evaluation
on:
  workflow_dispatch:
  push:
    branches: [feat/masterlabx-live-brain-20261107]
    paths:
      - 'Source/LiveStem*'
      - 'Source/StemgenRt*'
      - 'tests/LiveStem*'
      - 'tests/StemgenRt*'
      - 'tools/*stemgenrt*'
      - 'CMakeLists.txt'
      - 'licenses/StemgenRT/**'
      - '.github/workflows/stemgenrt-feasibility.yml'
permissions:
  contents: read
concurrency:
  group: stemgenrt-evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-neural:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact noncommercial evaluation weights
        run: python tools/fetch_stemgenrt_models.py --out build/models --accept-noncommercial-model-terms
      - name: Download official ONNX Runtime 1.26.0 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest https://github.com/microsoft/onnxruntime/releases/download/v1.26.0/onnxruntime-win-x64-1.26.0.zip -OutFile build/ort.zip
          Expand-Archive build/ort.zip -DestinationPath build
          python -m pip install --disable-pip-version-check psutil==7.1.3
      - name: Build native adapter and worker tests
        shell: pwsh
        run: |
          cmake -S . -B build-native -A x64 -DMASTERLAB_PLUGIN=OFF -DMASTERLAB_STEMGENRT=ON "-DMASTERLAB_ORT_ROOT=$pwd/build/onnxruntime-win-x64-1.26.0" "-DMASTERLAB_STEMGENRT_MODELS=$pwd/build/models"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-native --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression and actual neural waveform parity
        run: ctest --test-dir build-native -C Release --output-on-failure
      - name: Measure native neural inference and paced callback path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-native/evidence | Out-Null
          @'
          import json, pathlib, sys
          sys.path.insert(0, 'tools')
          from benchmark_stem_runtime import measure
          root=pathlib.Path('build-native/evidence')
          metrics=measure([str(pathlib.Path('build-native/Release/stemgenrt_benchmark.exe').resolve()), str(pathlib.Path('build/models').resolve()), '2000', '20'], root/'native-results.csv', 900)
          metrics.update({'kind':'noncommercial_evaluation_not_FL_Studio', 'rate':44100, 'ort':'1.26.0', 'model_revision':'7d2d0c19d956f67259b8358c4127f991077e02b0'})
          (root/'process-metrics.json').write_text(json.dumps(metrics,indent=2))
          print((root/'native-results.csv').read_text())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List | Out-File build-native/evidence/cpu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StemgenRT-noncommercial-native-evidence
          path: |
            build-native/evidence/
            build-native/Testing/Temporary/
            licenses/StemgenRT/
          if-no-files-found: error
      # Deliberately no model binaries or plugin installer in this evaluation artifact.
